version: '3.8'

services:
  # PostgreSQL database for Kine
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: kubernetes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kine-net

  # Baseline etcd for comparison
  etcd:
    image: quay.io/coreos/etcd:v3.5.13
    command:
      - /usr/local/bin/etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd0=http://etcd:2380
      - --initial-cluster-token=etcd-cluster-1
      - --initial-cluster-state=new
      - --auto-compaction-retention=1
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd_data:/etcd-data
    networks:
      - kine-net

  # Kine with event-driven notifications (default)
  kine-events:
    build: .
    command: >
      kine
      --endpoint=postgres://postgres:postgres@postgres:5432/kubernetes?sslmode=disable
      --listen-address=0.0.0.0:2379
      --debug
    ports:
      - "12379:2379"
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - KINE_DISABLE_NOTIFICATIONS=false
      - KINE_NOTIFICATION_BUFFER_SIZE=2048
    networks:
      - kine-net

  # Kine with polling mode (notifications disabled)
  kine-polling:
    build: .
    command: >
      kine
      --endpoint=postgres://postgres:postgres@postgres:5432/kubernetes?sslmode=disable
      --listen-address=0.0.0.0:2379
      --disable-notifications
      --debug
    ports:
      - "22379:2379"
      - "28080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - KINE_DISABLE_NOTIFICATIONS=true
    networks:
      - kine-net

  # Load tester container
  benchmark:
    image: golang:1.21-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - ./scripts:/scripts
    command: >
      sh -c "
        apk add --no-cache curl etcd-ctl &&
        sleep 10 &&
        /scripts/docker-benchmark.sh
      "
    depends_on:
      - etcd
      - kine-events
      - kine-polling
      - postgres
    networks:
      - kine-net

volumes:
  postgres_data:
  etcd_data:

networks:
  kine-net:
    driver: bridge